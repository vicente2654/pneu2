<script>
if (document.addEventListener) {
    document.addEventListener("keydown", bloquearSource);
} else { //Versões antigas do IE
    document.attachEvent("onkeydown", bloquearSource);
}

function bloquearSource(e) {
    e = e || window.event;

    var code = e.which || e.keyCode;

    if (
        e.ctrlKey &&
        (code == 83 || code == 85) //83 = S, 85 = U
    ) {
        if (e.preventDefault) {
            e.preventDefault();
        } else {
            e.returnValue = false;
        }

        return false;
    }
}
</script><style>

body {

}

/*habilita a seleção nos campos editaveis*/
input, textarea {
    -webkit-touch-callout: initial; /* iOS Safari */
      -webkit-user-select: text; /* Chrome/Safari/Opera */
       -khtml-user-select: text; /* Konqueror */
         -moz-user-select: text; /* Firefox */
          -ms-user-select: text; /* Internet Explorer/Edge */
              user-select: text;
}

/*habilita a seleção nos campos com o atributo contenteditable*/
[contenteditable=true] {

              user-select: all;
}

</script>

    <button id="continuarBtn" class="btn-custom" disabled onclick="irParaProximaPagina()">Continuar</button>

    <script>
        function selecionarMedida(medida) {
            // Remove a classe "selected" de todas as opções
            document.querySelectorAll('.opcao-card').forEach(card => {
                card.classList.remove('selected');
            });

            // Adiciona a classe "selected" na opção clicada
            const opcaoSelecionada = [...document.querySelectorAll('.opcao-card')].find(card => 
                card.innerText.trim() === medida
            );
            if (opcaoSelecionada) {
                opcaoSelecionada.classList.add('selected');
            }

            // Armazena no localStorage
            localStorage.setItem('medidaPneu', medida);
            console.log('Medida selecionada:', medida); // Depuração

            // Ativa o botão "Continuar"
            const botao = document.getElementById('continuarBtn');
            botao.classList.add('enabled');
            botao.disabled = false;
        }

        function irParaProximaPagina() {
            window.location.href = "index.html"; // Caminho corrigido
        }
    </script>
